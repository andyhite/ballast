# Ballast configuration — ~/.config/ballast/config.toml
# (override with $BALLAST_CONFIG, $XDG_CONFIG_HOME, or `ballast --config PATH`)
#
# You rarely need to edit this by hand: the menu bar item and Settings window
# (menu > Preferences…) change every option here, and so do setting commands
# (`layout …`, `master-ratio`, `master-count`, master grow/shrink/balance).
# Ballast rewrites only the values it changes; comments and layout stay put.
#
# Hot-reloaded on save. An invalid file is rejected as a whole: the previous
# config stays live and the error shows in the menu bar item + a notification.
# Validate without applying: `ballast check-config PATH`.
# Reloading never resets a Space's monocle flag or manual arrangement.

[settings]
focus_follows_mouse = false
# Warp the cursor to the newly focused window when WM-initiated focus
# (commands, close fallback) crosses a display boundary.
cursor_follows_focus = true

[settings.animation]
enabled = true
duration_ms = 180                  # 0…2000
easing = "ease_out_cubic"          # linear | ease_out_cubic | ease_in_out_cubic | ease_out_quint
# Only the focused window and a scrolling stack's windows interpolate; every
# other window snaps (design doc §5).
# "Reduce motion" in Accessibility settings always wins: no interpolation.

# A border that marks the focused window. A Ballast command that moves focus
# flashes it, then fades it out; holding `hold` alone (or with shift) shows it
# until you let go. Clicks, Cmd-Tab, and focus follows mouse never flash.
[settings.focus_flash]
enabled = true
duration_ms = 800                  # 100…5000, fade included (none under Reduce Motion)
hold = "alt"                       # alt | ctrl | cmd | none

# Defaults for every (display, Space) pair.
[layout]
# mode = "master_grid"             # unset: master_stack on a built-in (laptop) display, master_grid on
                                   #   external ones. Set it to pin one mode for every display:
                                   #   master_grid: masters beside a stack that tiles every window in
                                   #   grid_columns columns (up to grid_max per column, then the outermost
                                   #   column scrolls) | master_stack: masters beside a stack that shows
                                   #   one window at a time and scrolls | bsp | float (passthrough: WM
                                   #   never touches the Space)
master_ratio = 0.6                 # share of the master region, strictly between 0.05 and 0.95
master_count = 1                   # 1…16
stack_side = "right"               # right | left | bottom | top
stack_both_sides = false           # put a stack on both sides of the master (left+right or top+bottom,
                                   #   per stack_side's axis); master_ratio is the master's share, the two
                                   #   sides split the rest evenly. master_grid and master_stack only
grid_columns = 1                   # master_grid only: columns each stack side is split into, side by
                                   #   side, filled column-major nearest the master first. 1…8
grid_max = 0                       # master_grid only: most stack windows tiled per column; once a side
                                   #   holds more than grid_columns * grid_max, every column but the
                                   #   outermost caps at grid_max and the outermost scrolls like
                                   #   master_stack's one window. 0 = no limit. 0…16
stack_peek = 30                    # points of the previous/next stack window left showing at either end
                                   #   while a stack scrolls (master_stack, or master_grid past grid_max).
                                   #   0…200
split = "auto"                     # BSP split direction: auto = across the longer side of each region, so
                                   # windows next to a heavy one stack. horizontal | vertical pin EVERY
                                   # split (all columns | all rows)
bsp_shape = "dwindle"              # BSP arrangement: dwindle = spiral, new windows split the focused tile |
                                   # balanced = equal-area grid (4 equal windows = quarters), kept as
                                   # windows open and close until you rearrange by hand (then `reset`)
bsp_min_ratio = 0.25               # Weight Share Limit (both layouts): a heavy window gets at most 75% of
bsp_max_ratio = 0.75               #   a BSP split, and at most 3x (75/25) the size of the lightest window
                                   #   in its master or stack area
gaps = { inner = 8, outer = 8 }

# Per-(display, Space) overrides, addressed by the display's persistent UUID
# and the Space's 1-based ordinal among that display's desktops (fullscreen
# Spaces are not counted). `ballast spaces` prints both.
[[space]]
display = "640D0BA8-EB6C-4108-AA7B-E641F7C1826E"
ordinal = 1
mode = "bsp"
gaps = { inner = 12 }

[[space]]
display = "6D147BFB-7E3C-4CCD-9825-F1A5A059052D"
ordinal = 2
mode = "master_grid"
stack_side = "bottom"
master_ratio = 0.65

[[space]]                          # one stack window at a time here too (the default on a built-in display)
display = "6D147BFB-7E3C-4CCD-9825-F1A5A059052D"
ordinal = 3
mode = "master_stack"

[[space]]
display = "6D147BFB-7E3C-4CCD-9825-F1A5A059052D"
ordinal = 4
mode = "float"                     # hands off this Space entirely

# App rules. Match fields: app_id (bundle id, exact match, case-insensitive),
# app_name (substring, case-insensitive), title_regex, title_substring
# (case-insensitive), ax_role, ax_subrole. The matching rule with the most
# match fields wins; ties go to the earlier rule. Unmatched windows: weight
# 1, tiled only when they are standard windows (AXStandardWindow) that
# aren't modal, can be resized, and have a full-screen button — dialogs,
# panels, and settings/update/confirmation windows float instead. Add
# `float = false` to a rule to tile one anyway.
#
# Actions: weight (default 1), manage = false, float = true (+ placement,
# size), sticky = true (best effort, see docs), on_self_move = snap_back|adopt.
# Weight picks the master (heaviest first) and sizes tiles: a weight-2 window
# gets twice the stack height, or twice the BSP area, of a weight-1 window,
# up to the Weight Share Limit (bsp_min_ratio/bsp_max_ratio above).

# Weighted: Ghostty takes the master slot from anything lighter, live.
[[rule]]
app_id = "com.mitchellh.ghostty"
weight = 10
on_self_move = "adopt"             # terminals grid-snap their size; don't fight them

[[rule]]
app_name = "Slack"
weight = 1

# Never touched.
[[rule]]
app_id = "com.1password.1password"
manage = false

# Floating with a placement (display fractions of the visible frame).
[[rule]]
app_id = "us.zoom.xos"
title_substring = "Zoom Meeting"
float = true
placement = { x = 0.6, y = 0.05, w = 0.38, h = 0.4 }

[[rule]]
app_id = "com.apple.finder"
ax_subrole = "AXDialog"            # Finder's copy/info dialogs, not its browser windows
float = true
placement = "center"
size = { w = 0.35, h = 0.3 }

[[rule]]
title_regex = "^Picture.in.Picture$"
float = true
sticky = true
placement = { x = 0.74, y = 0.72, w = 0.25, h = 0.25 }

# Every binding needs a non-"shift" modifier, unless the key is F1–F20.
# Global hotkeys → commands (`ballast help` lists them all).
[bindings]
"alt+h" = "focus left"
"alt+j" = "focus down"
"alt+k" = "focus up"
"alt+l" = "focus right"
"alt+shift+h" = "swap left"
"alt+shift+j" = "swap down"
"alt+shift+k" = "swap up"
"alt+shift+l" = "swap right"
"alt+tab" = "focus-last"
"alt+return" = "promote"
"ctrl+return" = "focus-master"
"alt+r" = "reset"
"alt+space" = "layout next"
"alt+m" = "monocle"
"alt+t" = "float"
"alt+equal" = "grow"
"alt+minus" = "shrink"
"alt+shift+equal" = "master-count +1"
"alt+shift+minus" = "master-count -1"
"alt+0" = "balance"
"alt+period" = "send-to-display next"
"alt+comma" = "send-to-display prev"
"alt+shift+period" = "focus-display next"
"alt+shift+comma" = "focus-display prev"
"hyper+r" = "reload"
