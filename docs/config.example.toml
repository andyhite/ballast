# Ballast configuration — ~/.config/ballast/config.toml
# (override with $BALLAST_CONFIG, $XDG_CONFIG_HOME, or `ballast --config PATH`)
#
# You rarely need to edit this by hand: the menu bar item and Settings window
# (menu > Settings…) change every option here, and so do setting commands
# (`feature-size`, `feature-count`, feature grow/shrink/balance).
# Ballast rewrites only the values it changes; comments and layout stay put.
#
# Hot-reloaded on save. An invalid file is rejected as a whole: the previous
# config stays live and the error shows in the menu bar item + a notification.
# Validate without applying: `ballast check-config PATH`.
# Reloading never resets a Space's monocle flag or manual arrangement.

[settings]
focus_follows_mouse = false
# Warp the cursor to the newly focused window when WM-initiated focus
# (commands, close fallback) crosses a display boundary.
cursor_follows_focus = true

[settings.animation]
enabled = true
duration_ms = 180                  # 0…2000
easing = "ease_out_cubic"          # linear | ease_out_cubic | ease_in_out_cubic | ease_out_quint
# Only the focused window and a deck's windows interpolate; every
# other window snaps (design doc §5).
# "Reduce motion" in Accessibility settings always wins: no interpolation.

# A border that marks the focused window. A Ballast command that moves focus
# flashes it, then fades it out; holding `hold` alone (or with shift) shows it
# until you let go. Clicks, Cmd-Tab, and focus follows mouse never flash.
[settings.focus_flash]
enabled = true
duration_ms = 800                  # 100…5000, fade included (none under Reduce Motion)
hold = "alt"                       # alt | ctrl | cmd | none

# Defaults for every (display, Space) pair. A key left unset here uses a
# built-in default that depends on the screen: a display narrower than 1800 pt
# (every MacBook default resolution) is "small", any other is "large".
#   small: arrange = "fixed", columns = 1, rows = 1, feature = "none"
#          (one full-screen deck)
#   large: arrange = "fixed", columns = 1, rows = 2, feature = "left",
#          feature_size = 0.6, feature_count = 1
# A key set in [layout] applies to every screen; a [[space]] overrides it per desktop.
[layout]
# arrange = "fixed"                # how tiles are arranged outside the feature area:
                                   #   fixed: `columns` columns of up to `rows` tiles each; past
                                   #   columns * rows tiles the last column becomes a deck that scrolls
                                   #   with `rows` tiles in view | adaptive: equal cells, about
                                   #   sqrt(n) per side, the last row stretching | dwindle: BSP spiral,
                                   #   new windows split the focused tile | balanced: BSP equal-area
                                   #   grid (4 equal windows = quarters), kept as windows open and
                                   #   close until you rearrange by hand (then `reset`) | float: hands
                                   #   off (the WM never touches the Space)
# columns = 1                      # fixed: number of columns, 1…8. Columns are always vertical lines
                                   #   side by side, whatever side the feature is on
# rows = 2                         # fixed: tiles shown per column, stacked top to bottom, 0…16. 0 = no
                                   #   cap. 1×1 is one full-area deck. When tiles exceed columns * rows,
                                   #   every column but the last caps at `rows` and the last one decks;
                                   #   columns fill column-major from the one nearest the feature (the
                                   #   leftmost for top/bottom)
# feature = "left"                 # the optional large area, where the first `feature_count` tiles go
                                   #   (any arrange but float): none | left | right | top | bottom |
                                   #   center (feature in the middle, the grid split into a right and a
                                   #   left half; the right half gets the first half of the tiles,
                                   #   rounded up)
# float_placement = "cascade"      # float desktops: cascade (default) moves a newly opened window to the next
                                   #   free slot, 28 pt down/right of the last | none leaves it where it opened.
                                   #   Also allowed per [[space]]. Never under Stage Manager
feature_size = 0.6                 # share of the feature area, strictly between 0.05 and 0.95
feature_count = 1                  # featured windows, 1…16
deck_peek = 30                     # points of the previous/next window left showing at either end
                                   #   while a deck scrolls (overflow decks, 1×1 grids, monocle, manual
                                   #   decks). 0…200
split = "auto"                     # BSP (dwindle, balanced) split direction: auto = across the longer
                                   # side of each region, so windows next to a heavy one sit in a column.
                                   # horizontal | vertical pin EVERY split (all columns | all rows)
weight_share_min = 0.25            # Weight Share Limit (every arrangement but adaptive and float): a heavy
weight_share_max = 0.75            #   window gets at most 75% of a BSP split, and at most 3x (75/25) the
                                   #   size of the lightest window in its feature area or column
gaps = { inner = 8, outer = 8 }

# Per-desktop overrides. A desktop is addressed one of two ways; `ballast
# spaces` prints both:
#   uuid = "..."                   the desktop's own macOS Space UUID. Follows the
#                                  desktop when you reorder or delete others in
#                                  Mission Control. Preferred, and what Ballast
#                                  writes when you change a setting from the UI.
#   display = "..." + ordinal = N  the display's persistent UUID and the desktop's
#                                  1-based position among that display's desktops
#                                  (fullscreen Spaces are not counted). Shifts when
#                                  desktops are reordered. The only option if
#                                  `ballast spaces` shows no uuid for a desktop.
# If both kinds of entry match a desktop, the uuid one wins.
[[space]]
uuid = "06577405-6B31-4676-9725-A2F69D4232F4"
arrange = "dwindle"
gaps = { inner = 12 }

[[space]]
display = "6D147BFB-7E3C-4CCD-9825-F1A5A059052D"
ordinal = 2
arrange = "fixed"
columns = 2
rows = 3
feature = "bottom"
feature_size = 0.65

[[space]]                          # one full-screen deck (the default on a small display)
display = "6D147BFB-7E3C-4CCD-9825-F1A5A059052D"
ordinal = 3
arrange = "fixed"
columns = 1
rows = 1
feature = "none"

[[space]]                          # the feature in the middle, the rest split around it
display = "6D147BFB-7E3C-4CCD-9825-F1A5A059052D"
ordinal = 4
arrange = "adaptive"
feature = "center"

[[space]]
display = "6D147BFB-7E3C-4CCD-9825-F1A5A059052D"
ordinal = 5
arrange = "float"                  # hands off this Space entirely

# App rules. Match fields: app_id (bundle id, exact match, case-insensitive),
# app_name (substring, case-insensitive), title_regex, title_substring
# (case-insensitive), ax_role, ax_subrole. The matching rule with the most
# match fields wins; ties go to the earlier rule. Unmatched windows: weight
# 1, tiled only when they are standard windows (AXStandardWindow) that
# aren't modal or an Open/Save panel, can be resized, and have a full-screen
# button — dialogs, panels, and settings/update/confirmation windows float
# instead. Add `float = false` to a rule to tile one anyway.
#
# Actions: weight (default 1), manage = false, float = true (+ placement,
# size), sticky = true (best effort, see docs), on_self_move = snap_back|adopt.
# Weight picks the feature tiles (heaviest first) and sizes tiles: a weight-2 window
# gets twice the column height, or twice the BSP area, of a weight-1 window,
# up to the Weight Share Limit (weight_share_min/weight_share_max above).

# Weighted: Ghostty takes the feature slot from anything lighter, live.
[[rule]]
app_id = "com.mitchellh.ghostty"
weight = 10
on_self_move = "adopt"             # terminals grid-snap their size; don't fight them

[[rule]]
app_name = "Slack"
weight = 1

# Never touched.
[[rule]]
app_id = "com.1password.1password"
manage = false

# Floating with a placement (display fractions of the visible frame).
[[rule]]
app_id = "us.zoom.xos"
title_substring = "Zoom Meeting"
float = true
placement = { x = 0.6, y = 0.05, w = 0.38, h = 0.4 }

[[rule]]
app_id = "com.apple.finder"
ax_subrole = "AXDialog"            # Finder's copy/info dialogs, not its browser windows
float = true
placement = "center"
size = { w = 0.35, h = 0.3 }

[[rule]]
title_regex = "^Picture.in.Picture$"
float = true
sticky = true
placement = { x = 0.74, y = 0.72, w = 0.25, h = 0.25 }

# Every binding needs a non-"shift" modifier, unless the key is F1–F20.
# Global hotkeys → commands (`ballast help` lists them all).
[bindings]
"alt+h" = "focus left"
"alt+j" = "focus down"
"alt+k" = "focus up"
"alt+l" = "focus right"
"alt+shift+h" = "swap left"
"alt+shift+j" = "swap down"
"alt+shift+k" = "swap up"
"alt+shift+l" = "swap right"
# Decks: windows sharing one tile (uncomment to use)
# "ctrl+alt+h" = "deck left"
# "ctrl+alt+j" = "deck down"
# "ctrl+alt+k" = "deck up"
# "ctrl+alt+l" = "deck right"
# "ctrl+alt+u" = "undeck"
"alt+tab" = "focus-last"
"alt+return" = "promote"
"ctrl+return" = "focus-feature"
"alt+r" = "reset"
"alt+shift+r" = "relayout"
"alt+m" = "monocle"
"alt+t" = "float"
"alt+equal" = "grow"
"alt+minus" = "shrink"
"alt+shift+equal" = "feature-count +1"
"alt+shift+minus" = "feature-count -1"
"alt+0" = "balance"
"alt+period" = "send-to-display next"
"alt+comma" = "send-to-display prev"
"alt+shift+period" = "focus-display next"
"alt+shift+comma" = "focus-display prev"
"hyper+r" = "reload"
