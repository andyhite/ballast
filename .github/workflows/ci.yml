name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)" && swift --version
      - run: swift build
      - run: swift test
      - run: scripts/lint-core.sh
      - name: shellcheck
        run: |
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck --severity=warning scripts/*.sh
